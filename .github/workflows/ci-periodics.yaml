name: CI Periodics

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Periodics only read the repo; an explicit least-privilege grant
# also keeps zizmor's excessive-permissions audit clean.
permissions:
  contents: read

jobs:
  ap-torture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARTIFACTS: /tmp/artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          # Periodic scripts never push; don't leave the token in
          # .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run ap-torture
        run: ./dev/ci/periodics/ap-torture

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: artifacts-ap-torture
          path: /tmp/artifacts
          if-no-files-found: ignore
