name: site

on:
  push:
    branches: [main, "website/**"]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: site-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # ratchet:actions/configure-pages@v5.0.0
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || 'https://example.github.io/preview/' }}
        run: hugo -s site --minify --baseURL "$BASE_URL"
      - name: Check internal links
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || 'https://example.github.io/preview/' }}
        run: |
          BASE_PATH="$(echo "$BASE_URL" | sed -E 's|^https?://[^/]+||')"
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "/" ]; then
            BASE_PATH="/${BASE_PATH#/}"
            BASE_PATH="${BASE_PATH%/}/"
            echo "Checking internal links against base path: $BASE_PATH"

            FAILED=0
            for file in $(find site/public -name "*.html"); do
              for link in $(grep -oE '(href|src)=["'\''/]?[^ "'\''<>]+' "$file" | sed -E 's/^(href|src)=["'\'']?//' | grep '^/' | grep -v '^//' || true); do
                if [[ "$link" != "$BASE_PATH"* && "$link" != "${BASE_PATH%/}" ]]; then
                  echo "::error file=${file}::Internal link '${link}' does not start with '${BASE_PATH}'"
                  FAILED=1
                fi
              done
            done

            if [ "$FAILED" -ne 0 ]; then
              echo "Check failed: Found internal links missing base path prefix"
              exit 1
            fi
            echo "All internal links correctly match base path: $BASE_PATH"
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # ratchet:actions/upload-pages-artifact@v3.0.1
        with:
          path: site/public

  # main deploys everywhere; a fork also deploys its website/* branches, for previews
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.repository_owner != 'gke-labs')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ratchet:actions/deploy-pages@v4.0.5
