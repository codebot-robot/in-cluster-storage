apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: objectfs.labs.gke.io
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectfs-node-daemon
  namespace: kube-objectfs-system

---

kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-node-daemon-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]

---

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectfs-node-daemon-binding
subjects:
  - kind: ServiceAccount
    name: objectfs-node-daemon
    namespace: kube-objectfs-system
roleRef:
  kind: ClusterRole
  name: objectfs-node-daemon-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: objectfs-node-daemon
  namespace: kube-objectfs-system
spec:
  selector:
    matchLabels:
      app: objectfs-node-daemon
  template:
    metadata:
      labels:
        app: objectfs-node-daemon
    spec:
      hostPID: true
      serviceAccountName: objectfs-node-daemon
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/objectfs.labs.gke.io/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: objectfs-node-daemon
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          image: objectfs-node-daemon:latest
          args:
            - "--v=5"
            - "--endpoint=unix:///csi/csi.sock"
            - "--nodeid=$(NODE_ID)"
            - "--controller-address=objectfs-controller:50051"
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/objectfs.labs.gke.io/
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory

---

apiVersion: v1
kind: Service
metadata:
  name: objectfs-controller
  namespace: kube-objectfs-system
spec:
  selector:
    app: objectfs-controller
  ports:
    - port: 50051
      targetPort: 50051

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objectfs-controller
  namespace: kube-objectfs-system
spec:
  serviceName: objectfs-controller
  replicas: 1
  selector:
    matchLabels:
      app: objectfs-controller
  template:
    metadata:
      labels:
        app: objectfs-controller
    spec:
      containers:
        - name: objectfs-controller
          image: objectfs-controller:latest
          args:
            - "--v=5"
            - "--port=50051"
          ports:
            - containerPort: 50051
