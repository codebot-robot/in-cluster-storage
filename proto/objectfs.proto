syntax = "proto3";

package objectfs.v1alpha1;

option go_package = "github.com/gke-labs/in-cluster-storage/pkg/api/objectfs/v1alpha1;v1alpha1";

import "google/protobuf/timestamp.proto";

service ObjectFSController {
  rpc GetAttr(GetAttrRequest) returns (GetAttrResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc TruncateFile(TruncateFileRequest) returns (TruncateFileResponse);
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
  rpc Rmdir(RmdirRequest) returns (RmdirResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc Fsync(FsyncRequest) returns (FsyncResponse);
  rpc WatchVolume(WatchVolumeRequest) returns (stream WatchVolumeResponse);
  rpc ListBlobs(ListBlobsRequest) returns (ListBlobsResponse);
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
}

enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  WRITE_THROUGH_FSYNC = 1;
  LAZY_WRITE = 2;
  EAGER_REPLICATION = 3;
}

message EntryAttr {
  uint64 inode = 1;
  string path = 2;
  string name = 3;
  bool is_dir = 4;
  int64 size = 5;
  uint32 mode = 6;
  google.protobuf.Timestamp mod_time = 7;
  string sha256 = 8;
  string redirect_url = 9;
}

message GetAttrRequest {
  string volume_id = 1;
  string path = 2;
}

message GetAttrResponse {
  EntryAttr attr = 1;
}

message LookupRequest {
  string volume_id = 1;
  string parent_path = 2;
  string name = 3;
}

message LookupResponse {
  EntryAttr attr = 1;
}

message ReadDirRequest {
  string volume_id = 1;
  string path = 2;
}

message ReadDirResponse {
  repeated EntryAttr entries = 1;
}

message MkdirRequest {
  string volume_id = 1;
  string path = 2;
  uint32 mode = 3;
}

message MkdirResponse {
  EntryAttr attr = 1;
}

message CreateFileRequest {
  string volume_id = 1;
  string path = 2;
  uint32 mode = 3;
  bytes initial_content = 4;
}

message CreateFileResponse {
  EntryAttr attr = 1;
}

message ReadFileRequest {
  string volume_id = 1;
  string path = 2;
  int64 offset = 3;
  int64 size = 4;
}

message ReadFileResponse {
  bytes data = 1;
  string redirect_url = 2;
  bool eof = 3;
  int64 total_size = 4;
}

message WriteFileRequest {
  string volume_id = 1;
  string path = 2;
  int64 offset = 3;
  bytes data = 4;
  WriteMode write_mode = 5;
}

message WriteFileResponse {
  int64 bytes_written = 1;
  int64 new_size = 2;
  google.protobuf.Timestamp mod_time = 3;
}

message TruncateFileRequest {
  string volume_id = 1;
  string path = 2;
  int64 size = 3;
}

message TruncateFileResponse {
  EntryAttr attr = 1;
}

message UnlinkRequest {
  string volume_id = 1;
  string path = 2;
}

message UnlinkResponse {
  bool success = 1;
}

message RmdirRequest {
  string volume_id = 1;
  string path = 2;
}

message RmdirResponse {
  bool success = 1;
}

message RenameRequest {
  string volume_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message RenameResponse {
  EntryAttr attr = 1;
}

message FsyncRequest {
  string volume_id = 1;
  string path = 2;
}

message FsyncResponse {
  bool success = 1;
}

message WatchVolumeRequest {
  string volume_id = 1;
  string node_id = 2;
}

enum WatchEventType {
  EVENT_UNKNOWN = 0;
  EVENT_CREATED = 1;
  EVENT_MODIFIED = 2;
  EVENT_DELETED = 3;
  EVENT_RENAMED = 4;
}

message WatchVolumeResponse {
  WatchEventType event_type = 1;
  string path = 2;
  string old_path = 3;
  EntryAttr attr = 4;
}

message ListBlobsRequest {
  string from_sha = 1;
  int32 limit = 2;
  string sha_prefix = 3;
}

message ListBlobsResponse {
  repeated string sha256 = 1;
  bool end_of_data = 2;
}

message GetBlobRequest {
  string sha256 = 1;
  int64 offset = 2;
  int64 limit = 3;
}

message GetBlobResponse {
  bytes data = 1;
}

message ListVolumesRequest {
  int32 limit = 1;
  string from_volume_id = 2;
}

message VolumeInfo {
  string volume_id = 1;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
  bool end_of_data = 2;
}

message SnapshotInfo {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  int64 size = 3;
}

message ListSnapshotsRequest {
  string volume_id = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
  int32 limit = 4;
  string from_snapshot = 5;
}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
  bool end_of_data = 2;
}

message CreateSnapshotRequest {
  string volume_id = 1;
}

message CreateSnapshotResponse {
  string snapshot_name = 1;
  SnapshotInfo snapshot = 2;
}

enum MutationType {
  MUTATION_TYPE_UNSPECIFIED = 0;
  MUTATION_TYPE_MKDIR = 1;
  MUTATION_TYPE_CREATE_FILE = 2;
  MUTATION_TYPE_WRITE_FILE = 3;
  MUTATION_TYPE_TRUNCATE_FILE = 4;
  MUTATION_TYPE_UNLINK = 5;
  MUTATION_TYPE_RMDIR = 6;
  MUTATION_TYPE_RENAME = 7;
}

message MutationRecord {
  MutationType type = 1;
  string volume_id = 2;
  string path = 3;
  string old_path = 4;
  uint32 mode = 5;
  int64 size = 6;
  int64 offset = 7;
  google.protobuf.Timestamp mod_time = 8;
  string sha256 = 9;
  uint64 inode = 10;
  bytes data = 11;
  uint64 stream_seq = 12;
}


