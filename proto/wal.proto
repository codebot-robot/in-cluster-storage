syntax = "proto3";

package wal.v1alpha1;

option go_package = "github.com/gke-labs/in-cluster-storage/pkg/api/wal/v1alpha1;v1alpha1";

service WalBuffer {
  // One bidi stream per client stream. First message must be Hello.
  rpc Append(stream AppendRequest) returns (stream AppendResponse);
  // Force a flush to permanent object storage now. Returns once the segment is durable.
  rpc Flush(FlushRequest) returns (FlushResponse);
  // Read merged records in position order. Positions are strictly increasing within a witness incarnation;
  // positions above the last flushed position are provisional and may be reassigned
  // after a restart. Tail clamps from_position to last_flushed_position + 1 when it exceeds that, returning
  // the effective start in resumed_from on the first response. Consumers must deduplicate on (stream_id, stream_seq)
  // and must tolerate re-delivery from the last flushed position after reconnecting.
  rpc Tail(TailRequest) returns (stream TailResponse);
}

message AppendRequest {
  oneof msg {
    Hello hello = 1;
    AppendRecord record = 2;
  }
}

message Hello {
  bytes stream_id = 1;
}

message AppendResponse {
  oneof msg {
    HelloAck hello_ack = 1;
    Ack ack = 2;
  }
}

message HelloAck {
  uint64 witness_acked_stream_seq = 1;  // what the service has on local disk
  uint64 s3_acked_stream_seq = 2;       // permanent object storage watermark
}

message AppendRecord {
  uint64 stream_seq = 1;
  bytes payload = 2;
  uint32 crc32c = 3;
}

message Ack {
  uint64 witness_acked_stream_seq = 1;  // cumulative
  uint64 s3_acked_stream_seq = 2;       // cumulative
}

message FlushRequest {
}

message FlushResponse {
  uint64 last_position = 1;
}

message TailRequest {
  uint64 from_position = 1;
}

message LogRecord {
  uint64 position = 1;
  bytes stream_id = 2;
  uint64 stream_seq = 3;
  bytes payload = 4;
  uint32 crc32c = 5;
}

message TailResponse {
  LogRecord record = 1;
  uint64 resumed_from = 2;
}
