baseURL = "https://structured-data-streams.com/"
title = "Structured Data Streams"
locale = "en-us"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
timeZone = "UTC"

[params]
  description = "SQL, OLTP, OLAP and Filesystems as Snapshots over an Authoritative Stream of Proto Records."
  repo = "https://github.com/gke-labs/in-cluster-storage"
  status = "Design proposal with experimental Go implementation"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = false

[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

[sitemap]
  changefreq = "weekly"
